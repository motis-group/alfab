name: Install LibreDWG on Production

# LibreDWG provides dwg2dxf, which /api/cad/convert shells out to so the calculator can accept
# customer DWG drawings. Ubuntu does not package it, so it is built from source.
#
# The build happens on the CI runner, not on the droplet. The droplet is a 1 vCPU / 1 GB box and
# compiling LibreDWG there took over four minutes and dropped the SSH session. Building here takes
# about a minute and the droplet only receives a ~18 MB binary. `--disable-shared` links libredwg
# into dwg2dxf, so the binary needs nothing but libc and libm at runtime.
#
# This is a manual workflow rather than a deploy step: it only needs running once, and again when
# the pinned LibreDWG version changes.

on:
  workflow_dispatch:
    inputs:
      force_reinstall:
        description: 'Reinstall even if dwg2dxf is already on the droplet'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-libredwg
  cancel-in-progress: false

env:
  STAGE_DIR: /tmp/libredwg-stage

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DO_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DO_DEPLOY_PORT }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DO_DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DO_DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DO_DEPLOY_USER secret}"

          deploy_port="${DEPLOY_PORT:-22}"
          if ! [[ "${deploy_port}" =~ ^[0-9]+$ ]]; then
            echo "DO_DEPLOY_PORT must be a numeric SSH port." >&2
            exit 1
          fi

      - name: Build dwg2dxf on the runner
        run: |
          set -euo pipefail
          BUILD_ONLY=1 PREFIX="${STAGE_DIR}" bash scripts/install-libredwg.sh
          ls -la "${STAGE_DIR}/bin/dwg2dxf"
          ldd "${STAGE_DIR}/bin/dwg2dxf"

      - name: Write deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DO_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?Missing DO_DEPLOY_SSH_KEY secret}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/alfab_deploy_key
          chmod 600 ~/.ssh/alfab_deploy_key

      - name: Add deploy host to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [[ -n "${DEPLOY_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${DEPLOY_HOST}" > ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      # A binary built here only runs on the droplet if the droplet's glibc is at least as new as
      # the runner's. Compare them up front so a mismatch is an obvious message rather than a
      # confusing "version GLIBC_x.y not found" later.
      - name: Compare runner and droplet glibc
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"

          runner_glibc="$(ldd --version | head -n1 | awk '{print $NF}')"
          droplet_glibc="$(ssh -i ~/.ssh/alfab_deploy_key -p "${deploy_port}" -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" "ldd --version | head -n1 | awk '{print \$NF}'")"

          echo "runner glibc:  ${runner_glibc}"
          echo "droplet glibc: ${droplet_glibc}"

          oldest="$(printf '%s\n%s\n' "${runner_glibc}" "${droplet_glibc}" | sort -V | head -n1)"
          if [[ "${oldest}" != "${runner_glibc}" && "${runner_glibc}" != "${droplet_glibc}" ]]; then
            echo "::error::The droplet's glibc (${droplet_glibc}) is older than the runner's (${runner_glibc}), so a binary built here will not run there. Build on the droplet instead with: sudo bash scripts/install-libredwg.sh" >&2
            exit 1
          fi

      - name: Skip when already installed
        id: check
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"

          if [[ "${{ inputs.force_reinstall }}" == "true" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Forced reinstall requested."
            exit 0
          fi

          installed="$(ssh -i ~/.ssh/alfab_deploy_key -p "${deploy_port}" -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" "command -v dwg2dxf >/dev/null 2>&1 && dwg2dxf --version 2>&1 | head -n1 || true")"

          if [[ -n "${installed}" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already installed on the droplet: ${installed}"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the binary
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          scp -i ~/.ssh/alfab_deploy_key -P "${deploy_port}" -o ServerAliveInterval=30 "${STAGE_DIR}/bin/dwg2dxf" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/dwg2dxf.incoming"

      - name: Install it into /usr/local/bin
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"

          ssh -i ~/.ssh/alfab_deploy_key -p "${deploy_port}" -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
            sudo install -m 0755 -o root -g root /tmp/dwg2dxf.incoming /usr/local/bin/dwg2dxf
            rm -f /tmp/dwg2dxf.incoming"

      - name: Verify the converter runs on the droplet
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"

          ssh -i ~/.ssh/alfab_deploy_key -p "${deploy_port}" -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
            command -v dwg2dxf
            dwg2dxf --version | head -n1"

      - name: Restart the app so it picks up the new binary
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"

          ssh -i ~/.ssh/alfab_deploy_key -p "${deploy_port}" -o ServerAliveInterval=30 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail
            sudo systemctl restart alfab
            sudo systemctl is-active alfab"

      - name: Remove deploy SSH key
        if: ${{ always() }}
        run: rm -f ~/.ssh/alfab_deploy_key
